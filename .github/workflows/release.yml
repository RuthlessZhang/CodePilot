name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Validate release tag
        run: node scripts/validate-release-tag.mjs "$GITHUB_REF_NAME"
      - name: Run release gates
        run: npm run release:check
      - name: Pack release artifact
        id: pack
        shell: bash
        run: |
          mkdir release
          tarball=$(npm pack --pack-destination release --silent | tail -n 1)
          test -n "$tarball"
          echo "tarball=release/$tarball" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi
          npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance --tag "$dist_tag"
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then prerelease=--prerelease; else prerelease=; fi
          gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.tarball }}" \
            --verify-tag --generate-notes --title "CodePilot $version" $prerelease
